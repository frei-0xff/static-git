name: Compile Git

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: "Upstream Git version to compile (e.g. 2.56.0)"
        required: true
        type: string
        default: "2.56.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_COLOR: 1
      EARTHLY_DISABLE_ANALYTICS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Earthly
        run: |
          sudo wget \
            https://github.com/earthly/earthly/releases/download/v0.8.16/earthly-linux-amd64 \
            -O /usr/local/bin/earthly
          sudo chmod +x /usr/local/bin/earthly

      - name: Compile upstream Git release
        run: |
          earthly --use-inline-cache --save-inline-cache --strict \
            +build --GIT_VERSION="${{ inputs.git_version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-${{ inputs.git_version }}-linux-amd64
          path: ./dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Compress the binaries
        run: |
          tar -czf git-binaries.linux-amd64.tar.gz -C dist .

      - name: Upload compressed archive
        uses: actions/upload-artifact@v4
        with:
          name: git-${{ inputs.git_version }}-linux-amd64-archive
          path: git-binaries.linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
